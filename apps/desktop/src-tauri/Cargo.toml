[package]
name = "app"
version = "0.1.0"
description = "RoadTwin — Digital Road Twin desktop application"
authors = ["RoadTwin Team"]
license = "MIT"
repository = "https://github.com/nagasaipradhyumnapoola/Road_Twin"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
ureq = "2"
